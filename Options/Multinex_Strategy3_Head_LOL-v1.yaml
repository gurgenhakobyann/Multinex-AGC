# general settings
name: Multinex_Strategy3_Head_LOL_v1
model_type: ImageCleanModel
scale: 1
num_gpu: 1
manual_seed: 100
use_amp: false

# dataset and data loader settings
datasets:
  train:
    name: TrainSet
    type: Dataset_PairedImage
    dataroot_gt: data/LOLv1/Train/target
    dataroot_lq: data/LOLv1/Train/input
    geometric_augs: true

    filename_tmpl: '{}'
    io_backend:
      type: disk

    use_shuffle: true
    num_worker_per_gpu: 8
    batch_size_per_gpu: 8

    mini_batch_sizes: [8]   
    iters: [150000]
    gt_size: 256   
    gt_sizes: [256]

    dataset_enlarge_ratio: 1
    prefetch_mode: ~

  val:
    name: ValSet
    type: Dataset_PairedImage
    dataroot_gt: data/LOLv1/Test/target
    dataroot_lq: data/LOLv1/Test/input
    io_backend:
      type: disk

# network structures
network_g:
  type: Multinex

  in_ch: 3
  out_ch: 3
  base_channels: 40
  width_mult: 2.0

  use_depthwise: true
  act: ReLU

  per_illum_proj: false
  per_chroma_proj: false

  use_illum_attn: true
  use_chroma_attn: true
  illum_mid: 3
  chroma_mid: 3

  reduction_ratio: 8

  # --- heads & fusion ---
  luma_head_act: null
  chroma_head_act: null
  retinex_residual: true
  use_adaptive_gamma_head: true  # Strategy 3 ON: Learnable Adaptive Gamma Illumination Head
  eps: 1.0e-9

  # --- illumination maps ---
  illum_flags:
    mean: false
    rec709: true
    vmax: true
    lightness: true
    ycgco: false
    l2norm: true
    agc: false                   # Strategy 1 OFF: standard 4-channel S_L

  # --- chrominance maps ---
  chroma_flags:
    yuv_uv: false
    ycbcr_cbcr: true
    opponent: false
    chroma_rg: true
    hsv_s: true

  target_params: 45000

path:
  pretrain_network_g: ~ 
  strict_load_g: true
  resume_state: ~

train:
  total_iter: 150000
  warmup_iter: -100
  use_grad_clip: true

  scheduler:
    type: CosineAnnealingRestartCyclicLR
    periods: [46000, 104000]       
    restart_weights: [1, 1]
    eta_mins: [0.0003, 0.000001]   
  
  mixing_augs:
    mixup: true
    mixup_beta: 1.2
    use_identity: true

  optim_g:
    type: Adam
    lr: !!float 2e-4
    betas: [0.9, 0.999]
  
  pixel_opt:
    type: HybridLoss
    w_pixloss: 1.0
    w_perc: 0.01
    w_msssim: 0.2

val:
  window_size: 4
  val_freq: !!float 500
  save_img: false
  rgb2bgr: true
  use_image: false
  max_minibatch: 8

  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 0
      test_y_channel: false

logger:
  print_freq: 500
  save_checkpoint_freq: !!float 1000
  use_tb_logger: true
  wandb:
    project: low_light
    resume_id: ~

dist_params:
  backend: nccl
  port: 29500
